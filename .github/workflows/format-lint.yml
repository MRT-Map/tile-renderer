name: Format, Lint
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: $/.github/actions/mise

      - run: hk run format --all

      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        if: github.event_name != 'pull_request'
        with:
          default_author: github_actions
          message: Formatting
      - run: git status
        if: github.event_name == 'pull_request'

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    needs: format

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise

      - run: hk run sarif --all --no-fail-fast
      - id: matrix
        if: '!cancelled()'
        run: |
          # shellcheck disable=SC2012
          echo "value=[$(ls .sarif -Qm | sed s/\.sarif//g | tr '\n' ' ')]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with:
          name: sarif
          path: .sarif/*
          include-hidden-files: true

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.ref_name == 'main' && !cancelled()
        with:
          branch: lint
          title: Linting
      - run: git status
        if: github.ref_name != 'main' && !cancelled()
        
  upload-sarif:
    needs: lint
    runs-on: ubuntu-slim
    if: '!cancelled()'
    strategy:
      matrix:
        value: ${{ fromJSON(needs.lint.outputs.matrix) }}
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarif
          path: .sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: .sarif/${{ matrix.value }}.sarif
          category: ${{ matrix.value }}
