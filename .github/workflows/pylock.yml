name: "Update Python Lockfiles"

on:
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:
  # push:
  #   branches: ["**"]

jobs:
  python-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: dev
      - uses: $/.github/actions/mise
        with:
          envs: "py"

      - if: github.event_name == 'push'
        run: hatch env lock
          
      - if: github.event_name != 'push'
        run: hatch env lock --upgrade

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: github.event_name != 'push'
        with:
          commit-message: Python lock file maintenance
          branch: python-lock-file-maintenance
          title: Python lock file maintenance
      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        if: github.event_name == 'push'
        with:
          default_author: github_actions
          message: Python lockfile maintenance
