[tools]
python = "3.15.2"
"pipx:hatch" = { version = "1.18.2", python = "{{ read_toml(path='mise.toml')['tools']['python'] }}" }
uv = "0.13.10"

cargo-binstall = "1.28.0"
"cargo:resvg" = { version = "0.50.0", depends = "cargo-binstall" }
"cargo:usvg" = { version = "0.50.0", depends = "cargo-binstall" }

[env]
HATCH_ENV_TYPE_VIRTUAL_UV_PATH = { tools = true, value = "{% if os_family() == 'unix' %}{{ [tools.uv.path, exec(command='ls \"' ~ tools.uv.path ~ '\"') | trim, 'uv'] | join(sep='/') }}{% else %}{{ [tools.uv.path, 'uv.exe'] | join(sep='\\\\') }}{% endif %}" }
PIP_UPLOADED_PRIOR_TO = "P3D"
UV_EXCLUDE_NEWER = "3 days"

[settings]
minimum_release_age = "3d"
